services:
  rednet-science-coordinator:
    image: python:3.12-slim
    container_name: rednet-science-coordinator
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    working_dir: /workspace
    volumes:
      - ./README.md:/workspace/README.md:ro
      - ./SOUL.md:/workspace/SOUL.md:ro
      - ./manifest.json:/workspace/manifest.json:ro
      - ./app:/workspace/app:ro
      - ./examples:/workspace/examples:ro
    command: >
      sh -c "python /workspace/app/science_coordinator_service.py --host 0.0.0.0 --port 18884"
    labels:
      rednet.agent: "science-coordinator"
      rednet.mode: "observe"
      rednet.live_commands: "false"
