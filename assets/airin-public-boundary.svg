<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">REDNET Airin Skillbook: граница публикации</title>
  <desc id="desc">Схема показывает, что в публичный репозиторий попадают только обезличенные документы, таблицы и иллюстрации, а секреты и сырой корпус остаются в приватном контуре.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="publicBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#1f4b75"/>
    </linearGradient>
    <linearGradient id="privateBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b1b1b"/>
      <stop offset="100%" stop-color="#8a2d2d"/>
    </linearGradient>
    <linearGradient id="safeArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 700 22px Arial, sans-serif; fill: #f8fafc; }
      .text { font: 400 18px Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 400 14px Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 700 14px Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="540" fill="url(#bg)"/>

  <text x="60" y="58" class="title">REDNET Airin Skillbook</text>
  <text x="60" y="86" class="subtitle">Публичная витрина, которая показывает структуру проекта, но не раскрывает приватный контур</text>

  <rect x="60" y="130" rx="22" ry="22" width="470" height="300" fill="url(#publicBox)" filter="url(#shadow)"/>
  <rect x="670" y="130" rx="22" ry="22" width="470" height="300" fill="url(#privateBox)" filter="url(#shadow)"/>

  <rect x="90" y="160" rx="14" ry="14" width="120" height="28" fill="#93c5fd"/>
  <text x="103" y="180" class="chip">ПУБЛИЧНО</text>

  <rect x="700" y="160" rx="14" ry="14" width="120" height="28" fill="#fca5a5"/>
  <text x="713" y="180" class="chip">ПРИВАТНО</text>

  <text x="90" y="220" class="label">Что можно показать</text>
  <text x="90" y="258" class="text">README, docs, assets, changelog</text>
  <text x="90" y="294" class="text">таблицы навыков и мета-навыков</text>
  <text x="90" y="330" class="text">архитектура, roadmap, troubleshooting</text>
  <text x="90" y="366" class="text">обезличенные примеры и SVG-схемы</text>

  <text x="700" y="220" class="label">Что остаётся закрытым</text>
  <text x="700" y="258" class="text">сырой корпус чатов и личные диалоги</text>
  <text x="700" y="294" class="text">.env, токены, ключи, cookies, sessions</text>
  <text x="700" y="330" class="text">приватные PDF, капсулы, дампы</text>
  <text x="700" y="366" class="text">рабочая среда Hermes и секреты</text>

  <path d="M 535 280 C 590 280, 610 280, 665 280" fill="none" stroke="url(#safeArrow)" stroke-width="10" stroke-linecap="round"/>
  <polygon points="665,280 644,268 644,292" fill="#34d399"/>
  <text x="547" y="252" class="small">синтетизация + redaction + manual review</text>

  <rect x="60" y="460" rx="18" ry="18" width="1080" height="46" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="84" y="489" class="text">Правило: если материал может восстановить приватный контур, он не попадает в публичный GitHub.</text>
</svg>
