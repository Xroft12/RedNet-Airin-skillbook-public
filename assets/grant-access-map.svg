<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">REDNET Airin grant access map</title>
  <desc id="desc">A public-safe roadmap from QMeta and Airin to open-source, cyber and research access applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="55%" stop-color="#111b38"/>
      <stop offset="100%" stop-color="#20113a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fd7ff"/>
      <stop offset="100%" stop-color="#99f6c8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="180" fill="#7fd7ff" opacity="0.08"/>
  <circle cx="160" cy="430" r="220" fill="#ff4fd8" opacity="0.06"/>
  <path d="M90 395 C260 255 410 310 560 195 S880 150 1110 90" fill="none" stroke="#7fd7ff" stroke-opacity="0.22" stroke-width="3"/>
  <text x="70" y="88" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">REDNET Airin / QMeta</text>
  <text x="70" y="125" fill="#b9d6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">grant access roadmap • public-safe repository layer</text>
  <g filter="url(#glow)">
    <rect x="70" y="175" width="250" height="150" rx="24" fill="#101a32" stroke="#7fd7ff" stroke-width="2"/>
    <text x="95" y="220" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">QMeta Core</text>
    <text x="95" y="255" fill="#b9d6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">branch • audit • council</text>
    <text x="95" y="282" fill="#b9d6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">measure • answer • skill</text>
  </g>
  <g>
    <rect x="390" y="175" width="250" height="150" rx="24" fill="#101a32" stroke="#99f6c8" stroke-width="2"/>
    <text x="415" y="220" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Open Source</text>
    <text x="415" y="255" fill="#b9d6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Codex maintainer work</text>
    <text x="415" y="282" fill="#b9d6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">docs • tests • review</text>
  </g>
  <g>
    <rect x="710" y="175" width="250" height="150" rx="24" fill="#101a32" stroke="#ffd166" stroke-width="2"/>
    <text x="735" y="220" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Cyber Defense</text>
    <text x="735" y="255" fill="#b9d6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">safe code review</text>
    <text x="735" y="282" fill="#b9d6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">patch validation</text>
  </g>
  <g>
    <rect x="900" y="360" width="230" height="88" rx="22" fill="#101a32" stroke="#ff9de2" stroke-width="2"/>
    <text x="930" y="397" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Research Access</text>
    <text x="930" y="426" fill="#b9d6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">evals • metrics • reports</text>
  </g>
  <g stroke="url(#cyan)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 250 H382"/>
    <path d="M640 250 H702"/>
    <path d="M835 326 C870 360 890 378 900 400"/>
  </g>
  <g fill="#7fd7ff">
    <circle cx="350" cy="250" r="5"/><circle cx="670" cy="250" r="5"/><circle cx="880" cy="370" r="5"/>
  </g>
  <text x="70" y="462" fill="#d7e9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">RU/EN docs • no private state • synthetic examples • explicit safety gates</text>
</svg>
