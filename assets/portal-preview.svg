<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Превью read-only портала REDNET</title>
  <desc id="desc">Стилизованный скриншот портала: обзор, контуры, лаборатория, установка, проверки. Без реальных данных.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08101e"/><stop offset="1" stop-color="#18395d"/></linearGradient>
    <style>
      .bg{fill:url(#bg)} .panel{fill:rgba(255,255,255,.08);stroke:rgba(180,235,255,.38);stroke-width:2;rx:26}.tab{fill:rgba(127,215,255,.13);stroke:#82dcff;stroke-width:1.5;rx:16}.tab2{fill:rgba(255,255,255,.06);stroke:rgba(180,235,255,.22);stroke-width:1.2;rx:16}.ok{fill:#93f9c2}.hold{fill:#ffd166}.off{fill:#7f93a5}.t{font:800 36px Inter,Segoe UI,Arial,sans-serif;fill:#f7fbff}.h{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.p{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#d3edf8}.s{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#a8dff3}.code{font:600 14px Consolas,monospace;fill:#e9fbff}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect x="46" y="42" width="1188" height="636" rx="34" fill="rgba(0,0,0,.18)" stroke="rgba(200,244,255,.28)" stroke-width="2"/>
  <text x="82" y="102" class="t">REDNET Skillbook Portal</text>
  <text x="82" y="135" class="p">локальная витрина только чтения · без live-команд · без секретов</text>
  <g transform="translate(82 170)">
    <rect class="tab" width="100" height="42"/><text x="24" y="27" class="s">Обзор</text>
    <rect class="tab2" x="112" width="118" height="42"/><text x="136" y="27" class="s">Контуры</text>
    <rect class="tab2" x="242" width="136" height="42"/><text x="266" y="27" class="s">Лаборатория</text>
    <rect class="tab2" x="390" width="130" height="42"/><text x="414" y="27" class="s">Установка</text>
    <rect class="tab2" x="532" width="124" height="42"/><text x="556" y="27" class="s">Проверки</text>
  </g>
  <rect x="82" y="248" width="1090" height="145" class="panel"/>
  <text x="118" y="300" class="h">Skillbook готовится к публикации</text>
  <text x="118" y="333" class="p">Портал показывает назначение разделов, статусы модулей и границы безопасности.</text>
  <text x="118" y="362" class="p">Все кнопки действия превращены в подсказки или stop-gates.</text>
  <g transform="translate(870 285)">
    <circle cx="28" cy="28" r="28" class="ok" opacity=".85"/><text x="72" y="34" class="h">read-only</text>
  </g>
  <g transform="translate(82 430)">
    <rect class="panel" width="330" height="165"/>
    <circle cx="42" cy="48" r="16" class="ok"/><text x="72" y="55" class="h">Навыки</text>
    <text x="32" y="92" class="p">SKILL.md + протокол + карточка</text>
    <text x="32" y="126" class="code">skills/rednet-meta/…</text>
  </g>
  <g transform="translate(474 430)">
    <rect class="panel" width="330" height="165"/>
    <circle cx="42" cy="48" r="16" class="hold"/><text x="72" y="55" class="h">Установка</text>
    <text x="32" y="92" class="p">сначала dry-run, затем окно</text>
    <text x="32" y="126" class="code">install.ps1 -DryRun</text>
  </g>
  <g transform="translate(866 430)">
    <rect class="panel" width="306" height="165"/>
    <circle cx="42" cy="48" r="16" class="off"/><text x="72" y="55" class="h">Live actions</text>
    <text x="32" y="92" class="p">рестарты, сеть, публикации</text>
    <text x="32" y="126" class="code">disabled by design</text>
  </g>
  <text x="82" y="640" class="s">Скрин-превью синтетическое: реальных статусов, адресов, токенов, аккаунтов и приватных путей здесь нет.</text>
</svg>
