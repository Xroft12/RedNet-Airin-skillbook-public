<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">REDNET Airin Skillbook hero</title>
  <desc id="desc">Dark sci-fi hero banner for the public-safe REDNET Airin Skillbook repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.45" stop-color="#0b1d35"/>
      <stop offset="1" stop-color="#10142a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="35%" cy="34%" r="55%">
      <stop offset="0" stop-color="#7fd7ff" stop-opacity="0.52"/>
      <stop offset="0.42" stop-color="#4f9dff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4f9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="74%" cy="68%" r="60%">
      <stop offset="0" stop-color="#b69cff" stop-opacity="0.35"/>
      <stop offset="0.48" stop-color="#7fd7ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7fd7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7fd7ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd7ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fd7ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b69cff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="36" fill="url(#glowA)"/>
  <rect width="1280" height="520" rx="36" fill="url(#glowB)"/>
  <rect x="28" y="28" width="1224" height="464" rx="30" fill="url(#grid)" opacity="0.7"/>
  <path d="M70 380C210 330 260 180 410 208C570 238 570 354 745 320C910 288 970 154 1190 184" fill="none" stroke="url(#line)" stroke-width="2" opacity="0.8"/>
  <path d="M92 158C250 210 330 98 504 130C682 164 728 250 884 226C1015 206 1088 118 1195 132" fill="none" stroke="url(#line)" stroke-width="1.4" opacity="0.45"/>

  <g transform="translate(94 82)" filter="url(#softShadow)">
    <rect x="0" y="0" width="360" height="360" rx="44" fill="#0b1728" stroke="#7fd7ff" stroke-opacity="0.35"/>
    <circle cx="180" cy="180" r="118" fill="none" stroke="#7fd7ff" stroke-opacity="0.42" stroke-width="2"/>
    <circle cx="180" cy="180" r="74" fill="#0e223c" stroke="#b69cff" stroke-opacity="0.42" stroke-width="1.5"/>
    <path d="M180 68C224 98 250 132 250 180C250 229 224 263 180 292C136 263 110 229 110 180C110 132 136 98 180 68Z" fill="#dff7ff" opacity="0.92"/>
    <path d="M180 108C206 127 222 150 222 181C222 212 206 235 180 254C154 235 138 212 138 181C138 150 154 127 180 108Z" fill="#10243d" opacity="0.92"/>
    <circle cx="180" cy="180" r="16" fill="#7fd7ff" filter="url(#neon)"/>
    <g fill="#7fd7ff" filter="url(#neon)">
      <circle cx="92" cy="91" r="5"/>
      <circle cx="282" cy="114" r="4"/>
      <circle cx="295" cy="264" r="5"/>
      <circle cx="82" cy="266" r="4"/>
      <circle cx="180" cy="38" r="4"/>
      <circle cx="180" cy="322" r="4"/>
    </g>
    <g stroke="#7fd7ff" stroke-opacity="0.38" stroke-width="1.3" fill="none">
      <path d="M92 91L180 180L282 114"/>
      <path d="M82 266L180 180L295 264"/>
      <path d="M180 38V180V322"/>
    </g>
  </g>

  <g transform="translate(510 96)">
    <text x="0" y="0" fill="#8ee8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="4">PUBLIC-SAFE AGENT SKILLBOOK</text>
    <text x="0" y="70" fill="#f6fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800">REDNET Airin</text>
    <text x="0" y="132" fill="#f6fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800">Skillbook</text>
    <text x="0" y="184" fill="#bcd7ea" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Навыки · протоколы · read-only портал · безопасная публикация</text>

    <g transform="translate(0 226)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
      <rect x="0" y="0" width="176" height="46" rx="23" fill="#10243d" stroke="#7fd7ff" stroke-opacity="0.45"/>
      <text x="24" y="30" fill="#dff7ff">dry-run first</text>
      <rect x="194" y="0" width="176" height="46" rx="23" fill="#10243d" stroke="#99f6c8" stroke-opacity="0.45"/>
      <text x="218" y="30" fill="#e8fff3">read-only UI</text>
      <rect x="388" y="0" width="206" height="46" rx="23" fill="#10243d" stroke="#f87171" stroke-opacity="0.42"/>
      <text x="412" y="30" fill="#ffe4e6">secrets excluded</text>
    </g>

    <g transform="translate(0 308)">
      <rect x="0" y="0" width="650" height="1" fill="#7fd7ff" opacity="0.28"/>
      <text x="0" y="42" fill="#88a8bf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Designed as a polished GitHub landing page: hero, screenshots, visual maps and release-safe boundaries.</text>
    </g>
  </g>
</svg>
